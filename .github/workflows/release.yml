name: release

# Build macOS / Linux / Windows artifacts on tag push (v*) and attach
# them to the GitHub release for that tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev libasound2-dev \
            libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libgtk-3-dev libssl-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo install cargo-bundle --locked
          ./bundle.sh

      # After bundle.sh, never before: it edits Info.plist with PlistBuddy and
      # signs ad-hoc, and both invalidate a real signature. The entitlements
      # are what keep the microphone working under the hardened runtime that
      # notarisation insists on.
      - name: Sign and notarise (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos-sign
        with:
          app-path: target/release/bundle/osx/Transcribe.app
          entitlements: .github/transcribe.entitlements
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          team-id: ${{ secrets.MACOS_TEAM_ID }}
          api-key-p8: ${{ secrets.MACOS_API_KEY_P8 }}
          api-key-id: ${{ secrets.MACOS_API_KEY_ID }}
          api-issuer-id: ${{ secrets.MACOS_API_ISSUER_ID }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          # ditto preserves the code signature, the extended attributes and
          # the stapled notarisation ticket; zip drops the last of those.
          ditto -c -k --keepParent target/release/bundle/osx/Transcribe.app \
            Transcribe-${{ matrix.target }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/transcribe
          cp target/release/transcribe-gui dist/transcribe/
          cp assets/linux/transcribe.desktop install-linux.sh dist/transcribe/
          cp assets/icon-256.png dist/transcribe/transcribe.png
          tar -czf transcribe-${{ matrix.target }}.tar.gz -C dist transcribe

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/transcribe-gui.exe `
            -DestinationPath transcribe-${{ matrix.target }}.zip

      # release.sh puts AI-generated release notes into the annotated tag's
      # message body; use them as the GitHub release body.
      - name: Extract release notes from tag annotation
        shell: bash
        run: |
          git fetch --force --no-tags origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" \
            > "$RUNNER_TEMP/release-notes.md"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            Transcribe-*.zip
            transcribe-*.tar.gz
            transcribe-*.zip
